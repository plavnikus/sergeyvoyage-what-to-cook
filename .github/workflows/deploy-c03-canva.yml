name: Deploy approved C03 image

on:
  push:
    branches: [main]
    paths:
      - '.deploy-c03'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved C03 image
        shell: bash
        run: |
          mkdir -p images
          curl -L --fail --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:1086/quality:100/uri:ifs%3A%2F%2FM%2Fcb1b9e53-1b3d-4caf-8805-7f5fce9ae5c8/watermark:F/width:1448?csig=AAAAAAAAAAAAAAAAAAAAANShbIio5zu3DrAHb_0qfC5gx5bsF4EvNszHOaCAUg6W&exp=1789232329&osig=AAAAAAAAAAAAAAAAAAAAANhX3awgwcfIiFZBG8f9yavX9nN6MCi7z3Q2I4EgTO-5&signer=media-rpc&x-canva-quality=thumbnail' -o images/c03.png
          file images/c03.png
          ls -lh images/c03.png
      - name: Commit image and cleanup transfer files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/c03.png
          git rm -f .deploy-c03 .github/workflows/deploy-c03-canva.yml
          git commit -m 'Add approved Food First image C03'
          git push
