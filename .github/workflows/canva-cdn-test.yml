name: canva-cdn-test
on:
  push:
    branches: [image-quality-fix-20260913]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try full-size Canva CDN variant
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://media.canva.com/v2/image-resize/format:JPG/height:900/quality:90/uri:ifs%3A%2F%2FM%2F78ef0a95-c03d-4f09-a01e-d5914c2417ca/watermark:F/width:1200?csig=AAAAAAAAAAAAAAAAAAAAAG9bpVfnUMI9APcSB53O78KkXlg--kXc8dAS7ykfu3ql&exp=1789312028&osig=AAAAAAAAAAAAAAAAAAAAAG_kP11pEWKPBoty47nm6cEvNSXJ3oh5EOZQcktwt6C1&signer=media-rpc&x-canva-quality=thumbnail'
          code=$(curl -L -sS -o /tmp/test.jpg -w '%{http_code}' "$URL")
          echo "HTTP=$code"
          wc -c /tmp/test.jpg || true
          file /tmp/test.jpg || true
          python3 - <<'PY'
          import struct
          p='/tmp/test.jpg'
          b=open(p,'rb').read()
          print('first20',b[:20])
          if b[:2] == b'\xff\xd8':
              i=2
              while i < len(b)-9:
                  if b[i] != 0xff: i+=1; continue
                  marker=b[i+1]; i+=2
                  if marker in [0xd8,0xd9]: continue
                  if i+2>len(b): break
                  L=int.from_bytes(b[i:i+2],'big')
                  if marker in list(range(0xc0,0xc4))+list(range(0xc5,0xc8))+list(range(0xc9,0xcc))+list(range(0xcd,0xd0)):
                      h=int.from_bytes(b[i+3:i+5],'big'); w=int.from_bytes(b[i+5:i+7],'big')
                      print('dims',w,h); break
                  i += L
          PY
