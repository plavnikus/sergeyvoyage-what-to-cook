name: Deploy staged food images

on:
  push:
    branches: [main]
    paths:
      - '.deploy-images/READY'

permissions:
  contents: write

jobs:
  decode-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged images
        shell: bash
        run: |
          mkdir -p images
          cat .deploy-images/f01.a .deploy-images/f01.b | base64 -d > images/f01.jpg
          file images/f01.jpg
      - name: Commit images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/f01.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add approved Food First image F01'
          git push
