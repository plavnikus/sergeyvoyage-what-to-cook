name: Deploy approved Food First images

on:
  push:
    branches: [image-deploy-final-20260913]
    paths:
      - '.imgstage/READY'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode approved images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          for id in c03 f01 f03 m08 v06 v08; do
            cat .imgstage/${id}.* | base64 -d > images/${id}.avif
            file images/${id}.avif
            test -s images/${id}.avif
          done
      - name: Commit decoded images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/c03.avif images/f01.avif images/f03.avif images/m08.avif images/v06.avif images/v08.avif
          git rm -rf .imgstage .github/workflows/deploy-images-final.yml
          git commit -m 'Add approved Food First recipe images'
          git push
