<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F6F3ED"><title>Что приготовить сегодня? — SergeyVoyage</title><style>:root{--cream:#F6F3ED;--g:#2B2B2B;--o:#FF6A1A;--ol:#6B7A5A;--m:#77736d;--line:rgba(43,43,43,.1)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--g);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;padding:18px 16px calc(36px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.logo{font-weight:900;font-size:20px;letter-spacing:-.04em}.logo b{color:var(--o)}.muted{font-size:12px;color:var(--m)}.ey{font-size:12px;font-weight:850;color:var(--ol);text-transform:uppercase;letter-spacing:.08em}h1{font-size:clamp(42px,11vw,64px);line-height:.95;letter-spacing:-.06em;margin:14px 0 18px}h2{font-size:32px;line-height:1.02;letter-spacing:-.045em;margin:12px 0}.lead{font-size:18px;line-height:1.42;color:#56524d}.chips,.meta,.sum{display:flex;gap:8px;flex-wrap:wrap}.chip,.meta span,.sum span{padding:8px 10px;border-radius:999px;background:rgba(107,122,90,.09);font-size:12px}.hero{margin:26px 0;background:linear-gradient(145deg,#2B2B2B,#3a3935);border-radius:28px;color:#fff;min-height:250px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-80px;top:-80px;background:rgba(255,106,26,.32)}.dish{font-size:76px;z-index:1}.hero p{font-size:17px;line-height:1.45;margin:0;z-index:1;max-width:390px}.btn,.opt{width:100%;border:0;border-radius:18px;padding:16px 18px;font-size:16px;font-weight:800}.primary{background:var(--o);color:#fff}.secondary{background:var(--ol);color:#fff}.ghost{background:transparent;border:1px solid var(--line);color:var(--g)}.back{border:0;background:none;color:var(--m);font-weight:700;padding:4px 0 14px}.progress{height:5px;border-radius:20px;background:rgba(43,43,43,.08);overflow:hidden;margin-bottom:26px}.progress i{display:block;height:100%;background:var(--o)}.opts{display:grid;gap:11px;margin-top:22px}.opt{display:flex;justify-content:space-between;align-items:center;text-align:left;background:rgba(255,255,255,.68);border:1px solid var(--line);color:var(--g)}.opt strong{display:block;font-size:17px}.opt small{display:block;color:var(--m);font-size:12px;margin-top:4px}.arr{color:var(--o);font-size:22px}.cards{display:grid;gap:16px;margin-top:20px}.card{overflow:hidden;background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:26px;box-shadow:0 8px 28px rgba(43,43,43,.06)}.visual{height:180px;display:grid;place-items:center;font-size:78px;background:linear-gradient(145deg,#e7d2b9,#b2ba95);position:relative}.visual.meat{background:linear-gradient(145deg,#ddbba7,#815548)}.visual.fish{background:linear-gradient(145deg,#c8dad8,#6d9895)}.visual.veg{background:linear-gradient(145deg,#dce5bf,#8fa266)}.rid{position:absolute;left:16px;top:16px;padding:7px 9px;border-radius:999px;background:rgba(255,255,255,.82);font-size:12px;font-weight:900}.body{padding:18px}.body h3{font-size:23px;line-height:1.08;letter-spacing:-.03em;margin:0 0 14px}.actions{display:grid;gap:10px;margin-top:18px}.note{font-size:12px;color:var(--m);line-height:1.45;margin-top:18px}.recipeHead{background:var(--g);color:white;border-radius:28px;padding:24px;margin-bottom:14px}.recipeHead h1{font-size:36px;margin:12px 0 18px}.section{background:rgba(255,255,255,.76);border:1px solid var(--line);border-radius:24px;padding:20px;margin:12px 0}.section h3{font-size:22px;margin:0 0 15px}.ingredients{list-style:none;margin:0;padding:0}.ingredients li{display:flex;justify-content:space-between;gap:18px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.steps{padding-left:22px}.steps li{padding:5px 0 11px;line-height:1.45}.offer{background:var(--ol);color:#fff;border-radius:26px;padding:22px;margin-top:18px}.offer h3{font-size:28px;line-height:1.05;margin:8px 0 12px}.offer p{line-height:1.45}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;max-width:88%;text-align:center}@media(min-width:620px){.cards{grid-template-columns:1fr 1fr}.card:first-child{grid-column:1/-1}}</style></head><body><main id="app" class="app"></main><script>const A=document.getElementById('app');let S={step:0,time:30,group:'any',sat:'any'};const data={chicken:[['🍗','Та самая курица в липкой медово-чесночной глазури','15 мин','4 порц.'],['🍝','Сливочная паста с курицей, ради которой стоит достать сковороду','25 мин','4 порц.'],['🌶️','Хрустящая курица в сладком чили: сочная внутри, липкая снаружи','25 мин','4 порц.']],meat:[['🥩','Стейк-ужин на одной сковороде: выглядит как из хорошего ресторана','15 мин','2 порц.'],['🌮','Хрустящие тако с сочным мясом и тянущимся сыром','20 мин','4 порц.'],['🍲','Лазанья, которую едят ложкой: густая, сырная и без возни со слоями','40 мин','4 порц.']],fish:[['🍤','Креветки в чесночно-лимонном масле: аромат собирает всех на кухне','10 мин','4 порц.'],['🐟','Нежная белая рыба с соусом, который хочется собрать хлебом','15 мин','4 порц.'],['🍝','Паста с сочными креветками и чесночным маслом','20 мин','4 порц.']],veg:[['🍝','Томатно-сырная паста за 10 минут, когда готовить совсем не хочется','10 мин','4 порц.'],['🍳','Шакшука в пряном томатном соусе: хлеб нужен до последней капли','25 мин','4 порц.'],['🫘','Сливочный нут с вялеными томатами, который хочется собирать хлебом','15 мин','4 порц.']]};function top(x=''){return `<header class="top"><div class="logo">Sergey<b>Voyage</b></div><div class="muted">${x}</div></header>`}function home(){S.step=0;A.innerHTML=`${top()}<div class="ey">● Подбор ужина</div><h1>Что приготовить сегодня?</h1><p class="lead">Три коротких вопроса — и получите три идеи ужина под ваше время и настроение.</p><div class="chips"><span class="chip">36 рецептов</span><span class="chip">без регистрации</span><span class="chip">быстрый выбор</span></div><div class="hero"><div class="dish">🍽️</div><p>Не ещё один список рецептов. А быстрый ответ на вопрос, который возникает каждый вечер.</p></div><button class="btn primary" id="start">Подобрать ужин</button>`;start.onclick=()=>{S.step=1;q()}}function q(){let t,l,o;if(S.step===1){t='Сколько есть времени?';l='Считаем честное общее время приготовления с нуля.';o=[['15','До 15 минут','Когда нужно максимально быстро'],['30','До 30 минут','Самый универсальный вариант'],['45','До 45 минут','Можно чуть спокойнее']]}else if(S.step===2){t='Что хочется приготовить?';l='Выберите продукт или оставьте выбор нам.';o=[['chicken','Курица',''],['meat','Мясо или фарш',''],['fish','Рыба и морепродукты',''],['veg','Без мяса',''],['any','Неважно','Покажем разные категории']]}else{t='Какой ужин хочется?';l='Это предпочтение влияет на порядок, но не ограничивает хороший выбор.';o=[['hearty','Посытнее','Паста, рис, сыр, насыщенные блюда'],['light','Полегче','Больше лёгких вариантов'],['any','Неважно','Не будем ограничивать выбор']]}A.innerHTML=`${top('Вопрос '+S.step+' из 3')}<button class="back" id="back">← Назад</button><div class="progress"><i style="width:${S.step/3*100}%"></i></div><div class="ey">Быстрый выбор</div><h2>${t}</h2><p class="lead">${l}</p><div class="opts">${o.map(x=>`<button class="opt" data-v="${x[0]}"><span><strong>${x[1]}</strong>${x[2]?`<small>${x[2]}</small>`:''}</span><span class="arr">→</span></button>`).join('')}</div>`;back.onclick=()=>{if(S.step===1)home();else{S.step--;q()}};document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let v=b.dataset.v;if(S.step===1)S.time=+v;if(S.step===2)S.group=v;if(S.step===3)S.sat=v;if(S.step<3){S.step++;q()}else results()})}function choose(){return S.group==='any'?[data.chicken[0],data.fish[0],data.veg[0]]:data[S.group]}function cls(e){return ['🥩','🌮','🍲'].includes(e)?'meat':['🍤','🐟'].includes(e)?'fish':['🍝','🍳','🫘'].includes(e)?'veg':''}function results(){let arr=choose();A.innerHTML=`${top('Ваши 3 варианта')}<button class="back" id="edit">← Изменить ответы</button><div class="ey">Подобрали под вас</div><h2>Вот что можно приготовить сегодня</h2><div class="sum"><span>до ${S.time} минут</span><span>${S.group==='any'?'разные продукты':({chicken:'курица',meat:'мясо или фарш',fish:'рыба и морепродукты',veg:'без мяса'})[S.group]}</span><span>${S.sat==='hearty'?'посытнее':S.sat==='light'?'полегче':'без ограничений'}</span></div><div class="cards">${arr.map((r,i)=>`<article class="card"><div class="visual ${cls(r[0])}"><span class="rid">0${i+1}</span>${r[0]}</div><div class="body"><h3>${r[1]}</h3><div class="meta"><span>${r[2]}</span><span>${r[3]}</span>${i===0?'<span>одна посуда</span>':''}</div><button class="btn primary open" data-i="${i}">Посмотреть рецепт</button></div></article>`).join('')}</div><div class="actions"><button class="btn secondary" id="again">Хочу другие варианты</button><button class="btn ghost" id="new">Начать заново</button></div><p class="note">Визуальный прототип. Следом подключим полную базу из 36 рецептов и Food First-фотографии.</p>`;edit.onclick=()=>{S.step=1;q()};new.onclick=home;again.onclick=()=>toast('В полной версии здесь будет повторный подбор из базы.');document.querySelectorAll('.open').forEach(b=>b.onclick=()=>recipe(arr[+b.dataset.i]))}function recipe(r){A.innerHTML=`${top('Рецепт')}<button class="back" id="br">← К трём вариантам</button><div class="recipeHead"><div class="ey" style="color:#E6D9C2">Ваш вариант</div><h1>${r[1]}</h1><div class="meta"><span>${r[2]}</span><span>${r[3]}</span></div></div><section class="section"><h3>Ингредиенты</h3><ul class="ingredients"><li><span>Основной продукт</span><b>500–600 г</b></li><li><span>Овощи / гарнир</span><b>по рецепту</b></li><li><span>Соус и специи</span><b>по вкусу</b></li><li><span>Зелень для подачи</span><b>по желанию</b></li></ul></section><section class="section"><h3>Как приготовить</h3><ol class="steps"><li>Подготовьте ингредиенты.</li><li>Обжарьте или запеките основной продукт.</li><li>Добавьте соус и доведите до готовности.</li><li>Подавайте сразу.</li></ol></section><section class="offer"><div class="ey" style="color:#E6D9C2">Когда не хочется выбирать каждый вечер</div><h3>50 быстрых ужинов</h3><p>Готовая коллекция идей для обычных будней — без бесконечного поиска рецепта перед ужином.</p><button class="btn primary" id="buy">Посмотреть подборку</button></section>`;br.onclick=results;buy.onclick=()=>toast('Платный продукт подключим после утверждения MVP.')}function toast(x){let d=document.createElement('div');d.className='toast';d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}home();</script></body></html>
